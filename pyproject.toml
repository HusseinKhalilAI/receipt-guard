[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "receipt-guard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pillow", "pillow-heif","zxing-cpp", "opencv-contrib-python-headless"]

[project.optional-dependencies]
dev = ["pytest","pandas"]
[tool.setuptools]
packages = ["engine"]