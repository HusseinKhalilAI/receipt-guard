[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "receipt-guard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pillow", "pillow-heif","zxing-cpp","paddlepaddle==3.2.*","paddleocr==3.7.0"]

[project.optional-dependencies]
dev = ["pytest","pandas","qrcode"]
[tool.setuptools]
packages = ["engine"]